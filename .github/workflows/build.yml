name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  SOLUTION: src/Racka.slnx
  PACKAGE_PROJECT: src/Racka.Host/Racka.Host.csproj

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # Nerdbank.GitVersioning needs the full history for the git height

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # Version = year.month from version.json + git height, e.g. 26.11.3. Builds outside main and the
      # v* tags (pull requests) get a -g<commit> pre-release suffix.
      - name: Version
        id: version
        run: |
          dotnet tool restore
          version=$(dotnet nbgv get-version --variable NuGetPackageVersion)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"
          if [[ "$GITHUB_REF" == refs/tags/v* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the computed version $version. Tag with 'dotnet nbgv tag'."
            exit 1
          fi
          if [[ "$(dotnet nbgv get-version --variable MajorMinorVersion)" != "$(date -u +%y.%-m)" ]]; then
            echo "::warning::version.json is not on the current year.month ($(date -u +%y.%-m)), bump it."
          fi

      - name: Restore
        run: dotnet restore "$SOLUTION"

      - name: Build
        run: dotnet build "$SOLUTION" --configuration Release --no-restore

      - name: Test
        run: dotnet test "$SOLUTION" --configuration Release --no-build

      # Only Racka.Host is packed: as a dotnet tool it carries Racka.Core, Racka.Providers,
      # Racka.Irc and HerdFlow inside the package.
      - name: Pack
        run: >
          dotnet pack "$PACKAGE_PROJECT"
          --configuration Release
          --output artifacts

      - uses: actions/upload-artifact@v5
        with:
          name: nupkg
          path: artifacts/*.nupkg
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write # NuGet trusted publishing exchanges the GitHub OIDC token for an API key
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: nupkg
          path: artifacts

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: NuGet login (trusted publishing)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to nuget.org
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
